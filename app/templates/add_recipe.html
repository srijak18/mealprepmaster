{% extends "base.html" %}
{% block content %}
<h2>Add a New Recipe</h2>
<form method="post">
  <div class="mb-3">
    <input class="form-control" name="title" placeholder="Recipe Title" required>
  </div>
  <div class="mb-3">
    <textarea class="form-control" name="ingredients" rows="4" placeholder="Ingredients (comma-separated or line-separated)"></textarea>
  </div>
  <div class="mb-3">
    <textarea class="form-control" name="instructions" rows="4" placeholder="Instructions"></textarea>
  </div>
  <button class="btn btn-primary" type="submit">Save Recipe</button>
</form>
{% endblock %}
