{% extends "base.html" %}
{% block content %}
<!-- Your recipe display code here -->
{% for recipe in recipes %}
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>{{ recipe.title }}</strong>
      <form method="POST" action="{{ url_for('recipes.delete_recipe', recipe_id=recipe.id) }}" style="margin: 0;">
        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')">Delete</button>
      </form>
      <form method="POST" action="{{ url_for('recipes.toggle_favorite', recipe_id=recipe.id) }}">
  <button type="submit" class="btn btn-sm {{ 'btn-warning' if recipe.is_favorite else 'btn-outline-warning' }}">
    {{ '★ Favorite' if recipe.is_favorite else '☆ Add to Favorites' }}
  </button>
</form>
    </div>
    <div class="card-body">
      <p><strong>Ingredients:</strong></p>
      <p>{{ recipe.ingredients }}</p>
      <p><strong>Instructions:</strong></p>
      <p>{{ recipe.instructions }}</p>
    </div>
  </div>
{% endfor %}

{% endblock %}
