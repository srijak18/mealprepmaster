{% extends "base.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <h2 class="text-primary">Welcome to MealPrepMaster</h2>
  <h2 class="mb-4 text-center">Login</h2>
  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="mb-3">{{ form.email.label }} {{ form.email(class="form-control") }}</div>
    <div class="mb-3">{{ form.password.label }} {{ form.password(class="form-control") }}</div>
    <div class="mb-3">{{ form.submit(class="btn btn-primary w-100") }}</div>
  </form>
</div>
{% endblock %}
